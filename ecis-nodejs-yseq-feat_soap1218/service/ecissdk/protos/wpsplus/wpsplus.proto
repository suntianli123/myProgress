syntax = "proto3";

package wpsplus;

service WpsplusService {
  rpc getDeptUsers(GetDeptUsersRequest) returns (JsonResponse){}
}

message GetDeptUsersRequest{
  string comp_id = 1;
  string dept_id = 2;
  string query_str = 3;
}

message JsonResponse{
  string result = 1; // ok or error
  string data = 2; // json string
  string msg = 3; // error msg
}
