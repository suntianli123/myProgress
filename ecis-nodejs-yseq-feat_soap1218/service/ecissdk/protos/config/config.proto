syntax = "proto3";

package config;

/* 定义 config RPC 服务接口 */
service ConfigService{
  rpc put(ConfigSetRequest) returns (JsonResponse){}
  rpc get(ConfigGetRequest) returns (JsonResponse){}
}

message ConfigSetRequest{
  string key = 1;
  string value = 2;
}

message ConfigGetRequest{
  string key = 1;
}
message JsonResponse{
  string result = 1; // ok or error
  string data = 2; // json string
  string msg = 3; // error msg
}
