<script>
    function treeToArr(data, arr) {
        data.forEach((el) => {
            const itat = JSON.parse(JSON.stringify(el))
            arr.push(el)
            delete itat
            if (itat.length) {
                treeToArr(itat, arr)
            }
        })
    }
    var arr = [1,2,3,[4,5]]
    const ss = treeToArr(arr, [])
    console.log(ss)
</script>
