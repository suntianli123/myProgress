syntax = "proto3";

package account;

/* 定义 account RPC 服务接口 */
service AccountService {
  rpc isLogin(IsLoginRequest) returns (JsonResponse){}
  rpc getUserBySid(GetUserBySidRequest) returns (JsonResponse){}
}

message IsLoginRequest {
  string wps_sid = 1;
}

message GetUserBySidRequest {
  string wps_sid = 1;
  string csrf = 2;
}

message JsonResponse{
  string result = 1; // ok or error
  string data = 2; // json string
  string msg = 3; // error msg
}
