syntax = "proto3";

package globalRouter;

/* 定义全局路由服务接口 */
service GlobalRouterService{
  rpc bindRoute(BindRouteRequest) returns (JsonResponse){}
}

message BindRouteRequest{
  string src_route_path = 1;
}

message JsonResponse{
  string result = 1; // ok or error
  string data = 2; // json string
  string msg = 3; // error msg
}
