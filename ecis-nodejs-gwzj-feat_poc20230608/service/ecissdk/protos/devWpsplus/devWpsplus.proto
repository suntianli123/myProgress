syntax = "proto3";

package devWpsplus;

/* 定义 plus 开发者 RPC 服务接口 */
service DevWpsplusService {
  rpc getCompUsers(GetCompUsersRequest) returns (JsonResponse){}
}

message GetCompUsersRequest{
  string comp_id = 1;
  string query_str = 2;
}

message JsonResponse{
  string result = 1; // ok or error
  string data = 2; // json string
  string msg = 3; // error msg
}
